name: Publish Docker image

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mauckisch/patchforge:latest
            ghcr.io/mauckisch/patchforge:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=PatchForge for Linux
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          changelog_version = version.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()

          pattern = re.compile(
              rf"^## \[{re.escape(changelog_version)}\]\n"
              rf"(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )

          match = pattern.search(changelog)

          if not match:
              raise SystemExit(
                  f"Changelog section for {version} not found"
              )

          notes = match.group(1).strip() + "\n"

          Path("RELEASE_NOTES.md").write_text(notes)

          print(
              f"Prepared release notes for {version}"
          )
          PYTHON

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "PatchForge for Linux ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
