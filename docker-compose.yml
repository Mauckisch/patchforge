services:
  patchforge:
    image: ghcr.io/mauckisch/patchforge:latest

    container_name: patchforge

    restart: unless-stopped

    ports:
      - "7338:8080"

    volumes:
      - ./data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
